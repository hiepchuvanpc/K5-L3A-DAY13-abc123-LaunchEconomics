    - "NẾU chi phí mỗi việc thành công đo bằng thời gian thực tế vượt 8.000 đ hoặc tỉ lệ làm lại theo tuần vượt 7% TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ còn noi_dia, giữ giới hạn tối đa 2 lần chạy và rà 20 trace làm lại KHÔNG THÌ không được mở tiếp hang_nang hoặc nâng bước rollout"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) vượt 40% hoặc tỉ lệ mở trợ lý ở nhóm can thiệp dưới 50% TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày làm việc để chỉnh sửa giao diện và mẫu câu trả lời KHÔNG THÌ không được nâng bước rollout tiếp theo"
  interim_looks: "Chỉ kiểm tra chỉ số an toàn (mở lại 7 ngày, đối soát sổ cái ca 7/20, kiểm toán mẫu 100 đơn/tuần) và chỉ số chi phí/mức dùng hằng tuần; không kết luận chỉ số chính trước khi đủ m >= 299 yêu cầu/nhân viên ở bước 0,50"
