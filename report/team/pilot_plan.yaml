# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Phụ trách: Dương Tuấn Hưng (TV 3 · Pilot Lead), đối chiếu số với src/lab13.py và bang_chi_phi.md.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau_hai_ti_le(0.70, 0.75) = 1.251 yêu cầu mỗi nhóm (z chính xác 1,95996 và 0,84162; tổng 2.502).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 * 0,02 = 2,48; n = ceil(1.251 * 2,48) = 3.103 YC/nhóm -> cần 42 nhân viên/nhóm (tổng 84 > 40: KHÔNG ĐỦ NGƯỜI).
#   c) 20 nhân viên mỗi nhóm: trần cỡ mẫu hiệu dụng tối đa < c / ICC = 20 / 0,02 = 1.000 < 1.251 -> KHÔNG ĐẠT MDE 5 điểm.
#   d) 6 depot mỗi nhóm: trần cỡ mẫu hiệu dụng tối đa < 6 / 0,02 = 300 (và dưới 20 cụm/nhóm) -> QUÁ THẤP, LOẠI.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20m / (1 + (m - 1) * 0,02) >= 859 -> 2,82m >= 841,82 -> m >= 299 yêu cầu/nhân viên (DE = 6,96; cần tối thiểu ~10 ngày ở bước 0,50 với ~30,7 YC phạm vi pilot/người/ngày).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có - 20 nhân viên đối chứng chạy song song cùng tuần, cùng 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed = 20261121, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot chia sẻ câu trả lời; giảm bằng phân quyền truy cập theo tài khoản staff_id và ghi log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có - toàn bộ chỉ số chính, MDE 0,06, 3 luật dừng, lịch rollout và ngày quyết định 2027-01-05 chốt trước ngày chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: Có - đúng 20 nhân viên (cụm) mỗi nhóm (tổng 40 nhân viên LogiX-VN).
#
# Đánh đổi đã chấp nhận:
#   Chọn chia theo nhân viên (20 + 20 cụm) để tách được tác động và tránh tràn tác động trong cùng nhân viên; chấp nhận nâng MDE từ 5 điểm lên 6 điểm (n_per_arm = 859, m >= 299, DE = 6,96). Con số bất lợi: nếu tác động thật chỉ là 5 điểm thì power chỉ còn 0,64 (Giám đốc vận hành ký chấp nhận trước khi chạy).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu là 4,25% (51/1.200), riêng phạm vi noi_dia + hang_nang là 3,97% (39/982). Nếu đặt ngưỡng tuyệt đối 3% thì pilot sẽ dừng ngay tuần đầu; vì vậy đặt ngưỡng so với nhóm đối chứng (cao hơn >= 2 điểm phần trăm) kèm trần tuyệt đối 6%, cộng điều kiện 0 ca hoàn trùng hoặc lệch sổ cái.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (2.696 đ = 0,22x, simulated) và hang_nang (8.221 đ = 0,69x, simulated) tại 12 depot, giới hạn tối đa 2 lần chạy (chi phí cả hệ thống thấp nhất 6.901.220 đ, simulated); loại hoàn toàn quoc_te (22.515 đ = 1,88x, thành công 27,3%, simulated) và doi_tac (10.215 đ = 0,85x, simulated)"
