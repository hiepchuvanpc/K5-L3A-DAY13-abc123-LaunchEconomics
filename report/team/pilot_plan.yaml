    spillover_risk: "Rủi ro trao đổi kinh nghiệm trong cùng depot; giảm thiểu bằng khoá quyền truy cập trợ lý theo tài khoản staff_id riêng và log mọi lượt mở gợi ý theo staff_id"
    predeclared: "Đã chốt trước ngày bắt đầu toàn bộ chỉ số chính, MDE 0,06, 3 luật dừng 4 vế, lộ trình rollout và ngày quyết định 2027-01-05"
